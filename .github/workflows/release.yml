name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ${{ vars.BINARY_NAME || 'distributed-inference-operator' }}
  TARGET: x86_64-unknown-linux-gnu
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET" --bin "$BINARY_NAME"

      - name: Package SDK artifacts and registration definition
        run: |
          BIN="target/$TARGET/release/$BINARY_NAME"
          strip "$BIN"
          CORE_DIR="$(cargo metadata --locked --format-version 1 | jq -er '.packages[] | select(.name == "tangle-inference-core") | .manifest_path | sub("/Cargo.toml$"; "")')"
          node "$CORE_DIR/scripts/register-blueprint.mjs" --package --definition deploy/definition.json --output-dir release --tag "$RELEASE_TAG" --binary "$BIN"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes "SDK operator bundle for $TARGET; checksums and registration definition are included."
          gh release upload "$RELEASE_TAG" release/*.tar.xz release/*.sha256 release/dist-manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" release/blueprint-definition.json --repo "$GITHUB_REPOSITORY" --clobber
