[package]
name = "distributed-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "distributed_inference"
path = "src/lib.rs"

[[bin]]
name = "distributed-inference-operator"
path = "src/main.rs"

[dependencies]
blueprint-sdk = { workspace = true, features = ["tee"] }
alloy = { workspace = true }
alloy-sol-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Shared inference operator infrastructure (billing, metrics, health, server helpers)
tangle-inference-core = { git = "https://github.com/tangle-network/tangle-inference-core", rev = "7f9eb4d57f94a20b655f3aa8768211f6b18f1785", default-features = false, features = ["billing", "http", "metrics"] }

# Web framework (OpenAI-compatible HTTP server)
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace", "timeout"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Metrics
prometheus = { workspace = true }

# Streaming
futures-util = { workspace = true }
tokio-stream = { workspace = true }

# Misc
bytes = "1"

[dev-dependencies]
wiremock = "0.6"
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tower = { version = "0.5", features = ["util"] }
alloy-primitives = "1"
